name: mechanix-messages
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Dhanish Patel <dhanishp@ext.mechasystems.com>"
description: Mechanix Messages application
homepage: https://github.com/mecha-org/mechanix-messages.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.0
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.0)"

contents:
  - src: ./stage/bundle/mechanix_messages
    dst: /usr/share/mechanix/mechanix-messages/mechanix_messages
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-messages/lib/libapp.so
  - src: ./stage/bundle/lib/libobjectbox.so
    dst: /usr/share/mechanix/mechanix-messages/lib/libobjectbox.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-messages/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_messages
    file_info:
      mode: 0755
  - src: ./org.mechanix.messages.desktop
    dst: /usr/share/applications/org.mechanix.messages.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.messages.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
